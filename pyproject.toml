[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdec"
version = "0.2.2"
description = "GDEC: Goal-Driven Engineering Computation - Language, Compiler, Intelligent Runtime and Adaptive FEM Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "GDEC Research & Development Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-fem>=9.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "lark>=1.1.9",
    "pydantic>=2.7.0",
    "psutil>=5.9.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
]
test = [
    "pytest>=8.0.0",
    "sympy>=1.13.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
gdec = "gdec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gdec.language" = ["*.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "confirmatory: Confirmatory experiment runs (Tier 1, Tier 2, Tier 3) - excluded from standard CI",
]
addopts = "-m 'not confirmatory'"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
