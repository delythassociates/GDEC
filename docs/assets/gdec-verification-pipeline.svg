<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">GDEC conceptual verification pipeline</title>
<desc id="desc">A left-to-right pipeline from engineering declaration through compilation, numerical solve, estimation and adaptation, independent checks, and an evidence-qualified engineering result. A lower lane records assumptions, residual risks, and refusal conditions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a2b"/><stop offset="1" stop-color="#182b42"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#32d6c5"/><stop offset="1" stop-color="#68a7ff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".22"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#83a9c9"/></marker>
  <style>
    .h{font:700 25px Arial,sans-serif;fill:#f4f8ff}.sub{font:14px Arial,sans-serif;fill:#a9bfd5}
    .box{fill:#203750;stroke:#3c5e7d;stroke-width:1.5;filter:url(#shadow)}
    .num{font:700 13px Arial,sans-serif;fill:#061a2a}.label{font:700 17px Arial,sans-serif;fill:#f2f7fc}
    .body{font:13px Arial,sans-serif;fill:#bcd0e2}.arrow{stroke:#83a9c9;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .lane{fill:#14263a;stroke:#35506a;stroke-width:1.2;stroke-dasharray:7 6}
    .laneText{font:700 15px Arial,sans-serif;fill:#d6e5f2}
  </style>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/>
<text x="54" y="56" class="h">GDEC · From engineering intent to evidence-qualified output</text>
<text x="54" y="83" class="sub">Conceptual system flow · not a claim that every component is complete or independently validated</text>
<rect x="48" y="124" width="170" height="156" rx="16" class="box"/>
<circle cx="74" cy="151" r="14" fill="url(#accent)"/><text x="74" y="156" text-anchor="middle" class="num">01</text>
<text x="68" y="190" class="label">Declare</text>
<text x="68" y="216" class="body">Geometry · material</text><text x="68" y="237" class="body">BCs · QoI · tolerance</text><text x="68" y="258" class="body">Compute budget</text>
<path d="M220 202 H247" class="arrow"/>
<rect x="252" y="124" width="170" height="156" rx="16" class="box"/>
<circle cx="278" cy="151" r="14" fill="url(#accent)"/><text x="278" y="156" text-anchor="middle" class="num">02</text>
<text x="272" y="190" class="label">Compile</text>
<text x="272" y="216" class="body">Parse and type-check</text><text x="272" y="237" class="body">Validate semantics</text><text x="272" y="258" class="body">Build typed IR</text>
<path d="M424 202 H451" class="arrow"/>
<rect x="456" y="124" width="170" height="156" rx="16" class="box"/>
<circle cx="482" cy="151" r="14" fill="url(#accent)"/><text x="482" y="156" text-anchor="middle" class="num">03</text>
<text x="476" y="190" class="label">Solve</text>
<text x="476" y="216" class="body">Primal FEM system</text><text x="476" y="237" class="body">Adjoint / QoI solve</text><text x="476" y="258" class="body">Solver diagnostics</text>
<path d="M628 202 H655" class="arrow"/>
<rect x="660" y="124" width="170" height="156" rx="16" class="box"/>
<circle cx="686" cy="151" r="14" fill="url(#accent)"/><text x="686" y="156" text-anchor="middle" class="num">04</text>
<text x="680" y="190" class="label">Estimate</text>
<text x="680" y="216" class="body">Residual / recovery</text><text x="680" y="237" class="body">Goal-oriented indicator</text><text x="680" y="258" class="body">Adapt mesh if needed</text>
<path d="M832 202 H859" class="arrow"/>
<rect x="864" y="124" width="170" height="156" rx="16" class="box"/>
<circle cx="890" cy="151" r="14" fill="url(#accent)"/><text x="890" y="156" text-anchor="middle" class="num">05</text>
<text x="884" y="190" class="label">Verify</text>
<text x="884" y="216" class="body">Reference comparison</text><text x="884" y="237" class="body">Equilibrium / convergence</text><text x="884" y="258" class="body">Tolerance assessment</text>
<path d="M1036 202 H1063" class="arrow"/>
<rect x="1068" y="124" width="92" height="156" rx="16" fill="#17483f" stroke="#38b99d" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1114" y="190" text-anchor="middle" class="label">Report</text><text x="1114" y="216" text-anchor="middle" class="body">QoI</text><text x="1114" y="237" text-anchor="middle" class="body">+ limits</text><text x="1114" y="258" text-anchor="middle" class="body">+ evidence</text>
<rect x="48" y="332" width="1112" height="154" rx="16" class="lane"/>
<text x="76" y="369" class="laneText">Evidence and refusal lane · accompanies every stage</text>
<g font-family="Arial,sans-serif" font-size="13" fill="#bcd0e2">
<rect x="76" y="391" width="235" height="62" rx="10" fill="#1b344b" stroke="#42617c"/><text x="94" y="416" font-weight="700" fill="#eaf3fb">Assumptions</text><text x="94" y="438">Model, units, BCs, validity range</text>
<rect x="336" y="391" width="235" height="62" rx="10" fill="#1b344b" stroke="#42617c"/><text x="354" y="416" font-weight="700" fill="#eaf3fb">Execution evidence</text><text x="354" y="438">Commit, backend, precision, tests</text>
<rect x="596" y="391" width="235" height="62" rx="10" fill="#1b344b" stroke="#42617c"/><text x="614" y="416" font-weight="700" fill="#eaf3fb">Numerical evidence</text><text x="614" y="438">Residual, QoI error, reference, rate</text>
<rect x="856" y="391" width="276" height="62" rx="10" fill="#3d2b2c" stroke="#a86c66"/><text x="874" y="416" font-weight="700" fill="#ffe4df">Refuse / qualify</text><text x="874" y="438">Insufficient evidence → no unqualified result</text>
</g>
<text x="54" y="528" class="sub">Research scope: 2D linear elasticity · P1 triangular FEM · CPU-first</text>
</svg>