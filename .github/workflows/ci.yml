name: GDEC CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "audit/**", "research/**"]
  schedule:
    # Upstream drift cron: weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-tests:
    name: Cross-Platform Matrix / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,amg]"

      - name: Byte-compile Python sources
        run: python -m compileall -q src tests benchmarks

      - name: Execute pytest test suite
        run: python -m pytest -q

  status-register-traceability:
    name: Status Register & Traceability Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,amg]"

      - name: Generate authoritative status register
        run: python scripts/generate_status_register.py --output results/status_register.json

      - name: Verify status register and enforce traceability
        run: python scripts/generate_status_register.py --check --input results/status_register.json

      - name: Post-test clean working tree check
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Upload Status Register Artifact
        uses: actions/upload-artifact@v4
        with:
          name: status-register-${{ github.sha }}
          path: results/status_register.json

  upstream-dependency-drift:
    name: Upstream Dependency Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unpinned latest scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,amg]"
          python -m pip install --upgrade numpy scipy scikit-fem matplotlib pandas pydantic lark sympy

      - name: Run verification test suite against latest upstream
        run: python -m pytest -q

  coverage-and-mutation:
    name: Mutation Resilience & Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies with pytest-cov
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,amg]"
          python -m pip install pytest-cov

      - name: Run test suite with coverage report
        run: python -m pytest --cov=src/gdec --cov-report=term --cov-report=xml tests/

      - name: Run targeted mutation sensitivity suite
        run: python -m pytest -v tests/verification/test_mutation_resilience.py

      - name: Run bounded source mutation campaign
        run: python scripts/run_mutation_campaign.py --output results/mutation_campaign_report.json

      - name: Upload Mutation Campaign Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutation-campaign-${{ github.sha }}
          path: results/mutation_campaign_report.json
