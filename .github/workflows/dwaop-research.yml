name: DWAOP research gate
on:
  push:
    branches:
      - research/dwaop-horizon-six-formal-gate-v0.3
  pull_request:
    branches:
      - research/dwaop-horizon-six-formal-gate-v0.3
jobs:
  dwaop-research-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Compile prototypes
        run: python -m compileall -q research/prototypes/dwaop_integrated_planner.py research/prototypes/dwaop_exhaustive_policy_oracle.py research/prototypes/dwaop_horizon_ladder.py
      - name: Run focused exact-resource action-contract diagnostic
        run: python -m pytest -q tests/research/test_dwaop_integrated_pruning.py::test_exact_resource_conversion_preserves_action_contracts_and_transitions
      - name: Run v0.2 regression and v0.3 horizon gates
        run: python -m pytest -q tests/research/test_dwaop_integrated_pruning.py tests/research/test_dwaop_adversarial_graphs.py tests/research/test_dwaop_mutations.py tests/research/test_dwaop_v03_horizon_ladder.py
      - name: Generate H6 and H8 metrics
        run: python research/prototypes/dwaop_horizon_ladder.py --stages 5 7 --output research/results/DWAOP_HORIZON_CAMPAIGN_v0.3.json
      - uses: actions/upload-artifact@v4
        with:
          name: dwaop-v03-python-${{ matrix.python-version }}
          path: research/results/DWAOP_HORIZON_CAMPAIGN_v0.3.json
