name: DSES analytical research gate
on:
  push:
    branches:
      - research/dses-envelope-comparative-benchmarks-v0.6
  pull_request:
    branches:
      - research/dses-envelope-comparative-benchmarks-v0.6
jobs:
  dses-certificate-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile analytical prototype
        run: python -m compileall -q research/prototypes/dses_v06.py
      - name: Run certificate and adversarial tests
        run: python -m pytest -q tests/research/test_dses_v06.py tests/research/test_dses_v06_certificate_hardening.py
